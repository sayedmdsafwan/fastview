[package]
name = "fastview"
version = "1.2.0"
edition = "2024"
description = "A tiny, instant photo viewer for Windows: fast opening, smooth zoom, crop and rotate"
license = "MIT"

[dependencies]
fast_image_resize = { version = "6", features = ["rayon"] }
jpeg-encoder = "0.7"
png = "0.18"
winreg = "0.56"
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_DataExchange",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Imaging",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
] }

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 1

